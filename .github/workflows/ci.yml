name: ci

# Repo-wide lint + test gate. Runs on every push and PR targeting development
# or main - the two branches that matter for release/merge decisions.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  lint:
    name: Lint (ruff, black, sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: sqlfluff (authoritative CRM reference DDL)
        working-directory: qa_pairs
        run: sqlfluff lint schema/ddl.sql

  qa-pairs:
    name: Q&A pairs (build CRM + hard-gated pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # qa_pairs/tests/ (contract, ground-truth re-execution, sqlfluff-on-
      # reference_sql, scoring, rephrase) is CRM-only today - it reads the
      # CRM full release, not any other domain's. Build just that one
      # domain so this stays fast; see tests/ below for the other domains'
      # Track-A coverage.
      - name: Build CRM dataset + Q&A pairs (full profile)
        run: |
          python main.py build-dataset --domain crm --profile full
          python main.py qa-build --domain crm --profile full

      - name: pytest qa_pairs/tests/
        run: python -m pytest qa_pairs/tests/ -q

  dataset-gates:
    name: Dataset gates (FK, row-cap, cross-domain uniqueness)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every domain's full release - the uniqueness requirement is "no
      # question appears in more than one domain," which can't be proven by
      # checking fewer than all five, and the FK/row-cap gates below re-check
      # every domain's exported artifacts independently of whatever
      # build-dataset already asserted internally during this same build.
      - name: Build all five domains' full Q&A releases
        run: |
          for domain in crm sales finance logistics project_management; do
            python main.py build-dataset --domain "$domain" --profile full
            python main.py qa-build --domain "$domain" --profile full
          done

      # Spec Section 13.2 / 7.6: named, independently-reported FK integrity
      # gate. This re-validates the already-exported CSVs on disk (--exported),
      # separate from whatever build-dataset's own internal pipeline already
      # asserted before publishing - belt and suspenders, and now a gate any
      # reader of the Actions UI can see pass or fail by name instead of only
      # as a side effect of another step's exit code.
      - name: FK integrity gate (all domains)
        run: |
          set -e
          for domain in crm sales finance logistics project_management; do
            echo "=== FK integrity: $domain ==="
            python main.py validate-fk --domain "$domain" --profile full --exported
          done

      # Spec Section 13.2 / 7.3: named row-cap assertion gate, same rationale
      # as the FK gate above - independently re-checks the exported CSVs.
      - name: Row-cap assertion (all domains)
        run: |
          set -e
          for domain in crm sales finance logistics project_management; do
            echo "=== Row cap: $domain ==="
            python main.py validate-row-caps --domain "$domain" --profile full --exported
          done

      - name: Check cross-domain question uniqueness
        run: python scripts/check_cross_domain_uniqueness.py

  reproducibility:
    name: Manifest hash regeneration (clean-room reproducibility, HC-7)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # HC-7 / Section 7.7: "A clean-room re-run from the committed seed must
      # produce byte-identical CSV output." validate-reproducibility does a
      # real clean-room rebuild per domain and byte-compares it (CSV bytes,
      # row/column counts, SHA-256) against the already-published release -
      # not a lighter dataframe-hash shortcut. This is the automated version
      # of the manual "double-run diff" passes previously only run ad hoc;
      # it is its own job (not folded into dataset-gates) because every
      # domain rebuilds its full dataset a second time internally here, which
      # roughly doubles that domain's build cost on top of dataset-gates'
      # own build - expensive, but this is exactly the check the spec names
      # and nothing else in this workflow proves it.
      - name: Build all five domains' full releases
        run: |
          for domain in crm sales finance logistics project_management; do
            python main.py build-dataset --domain "$domain" --profile full
          done

      - name: Clean-room reproducibility (all domains)
        run: |
          set -e
          for domain in crm sales finance logistics project_management; do
            echo "=== Reproducibility: $domain ==="
            python main.py validate-reproducibility --domain "$domain" --profile full
          done

  full-suite:
    name: Full test suite (generators, judge, scorecard)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Hard gate as of 2026-10-06: all 17 previously-known-failing tests
      # were fixed at the root cause (see the commit that removed this
      # comment's predecessor for the full breakdown), so this no longer
      # needs --ignore or continue-on-error.
      - name: pytest tests/
        run: python -m pytest tests/ -q
